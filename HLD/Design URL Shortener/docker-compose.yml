version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_user
      POSTGRES_PASSWORD: url_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  app:
    build: .
    depends_on:
      - postgres
      - redis
    expose:
      - "8000"

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - app

volumes:
  pgdata:
